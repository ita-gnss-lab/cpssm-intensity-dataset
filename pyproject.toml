[project]
name = "cpssm-multifrequency-intensity-dataset"
version = "0.1.0"
description = "Generate, read, analyze, and publish a triple-frequency CPSSM intensity dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.7",
    "loguru>=0.7",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "scipy>=1.13",
    "six>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpssm_dataset"]

[dependency-groups]
dev = [
    "dvc>=3.60",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

